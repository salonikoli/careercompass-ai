name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Groq API key for client-side AI analysis (must be set in GitHub Secrets)
          # Go to: Settings → Secrets and variables → Actions → New repository secret
          # Name: VITE_GROQ_API_KEY  |  Value: your Groq key from console.groq.com
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}

          # Backend API URL (set this to your Render deployment URL once deployed)
          # Example: https://ai-career-mentor-api.onrender.com/api
          # Until backend is deployed, leave unset — frontend will use client-side AI
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

          # Auth service URL (optional — auth is currently disabled in UI)
          VITE_AUTH_URL: ${{ secrets.VITE_AUTH_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
